name: Python application test with pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('airline-sentiment-project/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r airline-sentiment-project/requirements.txt

    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('stopwords')"

    - name: Test with pytest
      run: |
        cd airline-sentiment-project
        pytest tests/test_logic.py \
          --cov=. \
          --cov-config=.coveragerc \
          --cov-branch \
          --cov-report=xml \
          --cov-fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./airline-sentiment-project/coverage.xml
        fail_ci_if_error: true