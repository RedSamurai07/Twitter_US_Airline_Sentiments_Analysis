name: Python application test with pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./airline-sentiment-project

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Generate Lightweight Dummy Model for Testing
      working-directory: ./airline-sentiment-project
      run: |
        python -m pip install scikit-learn pandas
        python -c "
        import pandas as pd
        import pickle
        from sklearn.feature_extraction.text import TfidfVectorizer
        from sklearn.linear_model import LogisticRegression
        from sklearn.pipeline import Pipeline

        # Fix: Provide text samples representing at least 2 distinct classes
        X = ['I love this flight', 'This was a horrible airline experience']
        y = ['positive', 'negative']

        # Build and fit the mock pipeline
        pipeline = Pipeline([
            ('tfidf', TfidfVectorizer()),
            ('clf', LogisticRegression())
        ])
        pipeline.fit(X, y)

        # Save the pipeline out where your test scripts expect it
        with open('model_pipeline.pkl', 'wb') as f:
            pickle.dump(pipeline, f)
        "