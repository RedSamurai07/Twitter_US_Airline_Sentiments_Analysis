name: Python application test with pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./airline-sentiment-project

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Generate Lightweight Dummy Model for Testing
      run: |
        python -c "
        import pickle
        from sklearn.pipeline import Pipeline
        from sklearn.feature_extraction.text import TfidfVectorizer
        from sklearn.linear_model import LogisticRegression
        pipe = Pipeline([('vec', TfidfVectorizer()), ('clf', LogisticRegression())])
        pipe.fit(['sample flight tweet text'], ['positive'])
        with open('model_pipeline.pkl', 'wb') as f:
            pickle.dump(pipe, f)
        print('Mock model pipeline successfully generated for CI!')
        "

    - name: Test with pytest
      run: |
        export PYTHONPATH=.
        pytest